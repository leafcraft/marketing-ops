# marketing-ops — Marketing-Ops Pod (campaign & growth)
#
# A POD of digital employees + human roles that runs a marketing campaign end
# to end: brief -> audience + competitor intel -> strategy (KPIs, channel mix,
# budget) -> copy + visuals -> compliance gate -> human approval -> PUBLISH ->
# performance + attribution -> WORM audit. Reactive fast-paths for competitor
# moves and brand crises run alongside.
#
# The pod is a TEAM, not a pipeline (Rule 1). A coordinator owns the case; the
# Manager SUPERVISES and escalates stalls/violations; every wire is conditional;
# every human gate DEFAULT-DENIES on silence; the FINISHER (publisher) produces
# the real artifact and fails closed; the WORM sink is the terminus. Systems
# (GA4/Amplitude/Looker, Marketo/HubSpot, Brandwatch, Meta/LinkedIn/ESP) are
# TOOLS inside agents, never members.
#
# Design doctrine: .claude/skills/leafmesh/building-agents-thoroughly.md
# Field reference:  .claude/skills/leafmesh/agent-config-fields.md
# Gotchas:          .claude/skills/leafmesh/nuances-and-gotchas.md

name: "marketing-ops"
version: "1.0.0"
architecture: "managed_mesh"
environment: "development"
debug: true
log_level: "INFO"

persistence:
  backend: redis
  redis:
    host: "${REDIS_HOST:localhost}"
    port: ${REDIS_PORT:6379}
    db: 0
    password: "${REDIS_PASSWORD:}"
    auto_storage: true
    decode_responses: true
    default_ttl: 86400
    session_ttl: 604800

auto_discover:
  directory: "./agency"
  pattern: "*_agent.py"
  recursive: false

# ═══════════════════════════════════════════════════════════════════
# MANAGER — supervisor over the marketing team (NOT a router in the middle)
# ═══════════════════════════════════════════════════════════════════
manager:
  model: "gpt-4o-mini"
  domain: "generic"
  can_intervene: true

  prompt: |
    This mesh runs marketing operations as a TEAM. A successful campaign turn
    flows: coordinator opens the case -> strategist normalises the brief and
    builds strategy/KPIs/budget -> market intelligence covers audience segments
    AND the competitor landscape -> copywriter + visual briefer fan out ->
    compliance gates brand + legal safety -> a human approves -> the publisher
    (FINISHER) puts it live and tags attribution -> analytics reads performance
    from your platform -> the WORM audit records the terminus. Brand crises and
    competitor moves run reactive fast-paths through the brand guardian.

    Escalate to the CMO when: compliance flags brand or regulated-claim risk, a
    budget exceeds the brand ceiling, audience targeting overlaps protected
    attributes, a crisis lands, or any agent hands off a malformed artifact.
    Silence never advances a campaign.

    Watch for: claim drift across copy variants, audience fatigue (frequency-cap
    breach), and channel-mix drift away from forecast.

  routing:
    mode: "learning"
    memory_size: 250
    confidence_threshold: 0.7
    fallback: "all"
    decay_days: 30

  knowledge:
    serviceName: "mongo_main"
    enabled: true
    groupName: "marketing_runbook"

  # Command Center — the business KPI board designs ITSELF from what the agents
  # actually yield + the tools they run (never hand-written metrics). It reads
  # in business language because the yields are in business language
  # (campaign_id, budget_cents, published_channels, revenue_attributed_cents).
  command_center:
    enabled: true
    design_after_runs: 3
    max_metrics: 24

  escalation:
    targets:
      - type: "human_agent"
        agent: "cmo_human"
      - type: "webhook"
        url: "${PAGER_WEBHOOK:https://events.pagerduty.com/v2/enqueue}"
        method: "POST"
        headers:
          Content-Type: "application/json"
        payload_template:
          incident_id: "{{campaign_id}}"
          severity: "{{severity}}"
          message: "{{message}}"
          session_id: "{{session_id}}"
      - type: "channel"
        provider: "slack"
        channel_id: "${SLACK_MARKETING_CHANNEL:}"
        message_template: "[marketing] {{message}} — campaign {{campaign_id}}"

    auto_escalate:
      max_retries: 2
      max_errors_per_session: 3
      timeout_threshold: 2

  health_check_interval: 60
  agent_timeout_threshold: 300
  chain_completion_timeout: 600

mesh:
  call_timeout: 120

# 2.4.131 runtime block — creative + super-agent planning can run long. The
# 2.4.131 default dropped to 90s; raise it so a multi-step strategist plan is
# not cut off. (Omission is meaningful; this is the one non-default we need.)
timeouts:
  llm_hard_timeout_s: 300

# ═══════════════════════════════════════════════════════════════════
# DATA STRUCTURES
# ═══════════════════════════════════════════════════════════════════
data_structures:
  CampaignBrief:
    type: "object"
    properties:
      campaign_id: { type: "string" }
      brief_source: { type: "string" }
      product_or_topic: { type: "string" }
      target_market: { type: "string" }
      objectives: { type: "list" }
      budget_cents: { type: "number" }
      received_at_utc: { type: "string" }
    required: ["campaign_id", "brief_source"]

# ═══════════════════════════════════════════════════════════════════
# ENTRY POINTS — Rule 1: one per real-world trigger, many starting paths
# ═══════════════════════════════════════════════════════════════════
entry_points:
  - name: "new_brief"
    target: "campaign_coordinator_agent"
    description: "Marketing brief submitted via form / email / Asana — the coordinator opens the case"
    condition: always
  - name: "product_launch"
    target: "campaign_coordinator_agent"
    description: "Product team triggers a cross-functional launch"
    condition: always
  - name: "quarterly_planning"
    target: "campaign_coordinator_agent"
    description: "Cadence — quarterly portfolio planning kick-off"
    condition: always
  - name: "manual_action"
    target: "campaign_coordinator_agent"
    description: "Marketing-team-initiated action"
    condition: always
  - name: "campaign_status"
    target: "campaign_coordinator_agent"
    description: "Anyone asks 'where is my campaign?' — the coordinator answers from the case record"
    condition: always
  - name: "competitor_move"
    target: "market_intelligence_agent"
    description: "Reactive — a competitor pricing / launch / campaign signal"
    condition: always
  - name: "crisis_response"
    target: "brand_guardian_agent"
    description: "Brand / PR crisis — fast-path response coordination"
    condition: always
  - name: "brand_mention_ingest"
    target: "brand_guardian_agent"
    description: "Brand-mention signal from your social-listening platform (mode=ingest + sentiment rollups)"
    condition: always
  - name: "brand_sentiment_sweep"
    target: "brand_guardian_agent"
    description: "Sentiment sweep — mode=report + rollups; the guardian judges spike severity"
    condition: always
  - name: "email_campaign_ingest"
    target: "marketing_analytics_agent"
    description: "Push one email campaign's engagement metrics through the analytics connector (mode=ingest)"
    condition: always
  - name: "email_post_send_analysis"
    target: "marketing_analytics_agent"
    description: "Analyse one campaign's engagement vs segment 30d baseline (mode=report)"
    condition: always
  - name: "weekly_performance"
    target: "campaign_orchestrator_agent"
    description: "Weekly performance sweep across live campaigns (state read from your MAP)"
    condition: always
  - name: "schedule_social_posts"
    target: "social_media_agent"
    description: "Schedule a campaign across LinkedIn/Twitter/Instagram/TikTok/YouTube (mode=schedule)"
    condition: always
  - name: "triage_social_replies"
    target: "social_media_agent"
    description: "Classify incoming engagement; escalate angry/crisis (mode=triage)"
    condition: always
  - name: "aeo_geo_content_audit"
    target: "aeo_geo_optimiser_agent"
    description: "Score existing pages for AI-answer-engine pickup; recommend rewrites"
    condition: always
  - name: "manager_reply"
    target: "marketing_manager_human"
    description: "HITL resume — the marketing manager answers an approval request"
    condition: always
  - name: "legal_reply"
    target: "legal_reviewer_human"
    description: "HITL resume — legal answers a claim review"
    condition: always
  - name: "cmo_reply"
    target: "cmo_human"
    description: "HITL resume — the CMO answers a budget / crisis escalation"
    condition: always

# ═══════════════════════════════════════════════════════════════════
# AGENTS — the marketing team
# ═══════════════════════════════════════════════════════════════════
agents:

  # ────────────────────────────────────────────────────────────
  # campaign_coordinator_agent — Campaign Coordinator (AI). Owns the case end
  # to end: opens it on any brief, is the single point of contact, keeps live
  # status, and SEQUENCES the human gates (legal-cleared -> marketing manager)
  # so no two human members are wired directly to each other. Pure orchestration
  # — it never plans, drafts, reviews, or publishes.
  #   agency/campaign_coordinator_agent.py: @chain derive_action sets `action`
  #   DETERMINISTICALLY from who called + their verdict (routing is never
  #   hallucinated); @compose forwards the brief to the strategist and recovers
  #   the reviewed campaign from the pre-gate stash for the manager gate.
  # ────────────────────────────────────────────────────────────
  campaign_coordinator_agent:
    name: "campaign_coordinator_agent"
    agent_type: "llm"
    communication_type: "chain"
    model: "gpt-4o-mini"
    temperature: 0.1
    max_tokens: 900
    description: "Campaign Coordinator — opens the case, keeps status, sequences the human gates; single point of contact"
    prompt: |
      You are the Campaign Coordinator. You OWN each campaign from the moment a
      brief arrives to the moment it is live. You orchestrate the pod and keep
      the requester informed — you never build strategy, draft copy, review
      compliance, or publish yourself.

      Set `action` to route the case:
        - "open_case"       — a fresh brief arrived (no human verdict upstream);
                              hand it to the strategist.
        - "route_to_manager"— legal cleared the claims; advance to the marketing
                              manager for final sign-off.
        - "status"          — someone asked where a campaign stands; answer from
                              the case record, nothing invented.
      (A deterministic floor in the coordinator module RECOMPUTES `action` from
      who called you and their verdict and will override you — set it honestly,
      but the floor is the authority.)

      Echo `campaign_id` from the payload/upstream when present ("" when truly
      absent). `status_summary` is a one-line plain-English state for the
      requester; `waiting_on` names the next gate or agent.

      OUTPUT CONTRACT — respond with ONLY valid JSON containing exactly these keys:
      {"action": "open_case", "campaign_id": "", "status_summary": "", "waiting_on": ""}
    yields:
      action: "string"          # open_case | route_to_manager | status
      campaign_id: "string"
      status_summary: "string"
      waiting_on: "string"
    inputs:
      upstream_yields: "object"
      payload: "object"
    can_call:
      - agent: "campaign_strategist_agent"
        condition: "calling_agent_response.action == 'open_case'"
      - agent: "marketing_manager_human"
        condition: "calling_agent_response.action == 'route_to_manager'"

  # ────────────────────────────────────────────────────────────
  # campaign_strategist_agent — Campaign Strategist (AI, SUPER-AGENT). Normalises
  # the brief, then plans strategy/KPIs/channel-mix/budget. super_agent =
  # autonomous plan -> execute -> verify over a multi-step plan (the campaign
  # plan is exactly that shape). Its module wraps it:
  #   @pre_compose load_planning_context pulls the brief + segments + past
  #     performance + competitor signals + the brand spend ceiling (dev store
  #     day-0; connectors in prod);
  #   @compose ships market_intelligence / copywriter / visual_briefer the
  #     payload each needs;
  #   @chain enforce_spend_floor forces requires_cmo_escalation=true when total
  #     planned budget exceeds the brand ceiling (the LLM cannot waive the CMO
  #     gate) — UNLESS the CMO already approved on a resume.
  # Only the playbook `description` rides in the prompt; the full craft
  # (`responsibility`) is fetched on demand.
  # ────────────────────────────────────────────────────────────
  campaign_strategist_agent:
    name: "campaign_strategist_agent"
    agent_type: "llm"
    communication_type: "chain"
    model: "gpt-4o-mini"
    temperature: 0.2
    max_tokens: 1500
    max_tool_calls_per_message: 15   # super-agent planning + playbook loads chain up
    description: "Campaign Strategist — normalises the brief, then builds strategy, KPIs, channel mix, budget allocation"
    super_agent:                     # DICT form = the tuning path (2.4.123+); never flat super_agent_* keys
      cost_ceiling: 100000           # aggregate token budget for one campaign plan (default 50000)
      wall_clock: 900                # per-run wall-clock seconds (default 600)
    prompt: |
      You are the Campaign Strategist. Your responsibilities, in order:

      1. Normalise the brief — raw briefs arrive from form / email / launch /
         Asana. Extract the canonical CampaignBrief fields from the payload:
         - campaign_id: reuse any id present upstream/payload; else mint
           "camp-" + 10 random lowercase hex characters.
         - brief_source: from the payload; default "manual" when absent.
         - product_or_topic, target_market: copy from the payload, "" when absent.
         - objectives: list from the payload, [] when absent.
         - budget_cents: integer, 0 when unknown.
         - received_at_utc: ISO-8601 UTC from the payload when present, else "".
         Echo these fields in your output.

      2. Build the strategy: strategy_summary (2-3 sentences for the manager —
         lead with the angle, name the primary segment + KPI; never empty), kpis
         (name/target/measurement_window), channel_mix (channel/share_pct/
         rationale), budget_allocation (channel/budget_cents), timeline_weeks
         (default 4), requires_legal_review (true on regulated-industry OR
         comparative claims). Load the `build_strategy` playbook for the planning
         order; load `normalise_brief` for the field-extraction rules.

      3. Routing flags:
         - needs_market_intelligence = true ONLY on a FRESH brief: no
           market-intelligence yields upstream (primary_segments/persona_scores/
           competitor_summary/intel_briefing) AND no human_message. On an intel
           call-back or a human revision, set it false.
         - requires_cmo_escalation: your best judgment on whether the budget
           needs CMO sign-off. (The spend floor in the module RECOMPUTES this
           from summed budget_allocation vs the brand ceiling and overrides you.)
         - When human_message is present: from the CMO it means PROCEED (a
           budget already signed off — re-plan the same brief and fan out to
           creative); from a reviewer it is a revision instruction — re-plan.

      OUTPUT CONTRACT — respond with ONLY valid JSON containing exactly these keys:
      {"campaign_id": "", "strategy_summary": "", "kpis": [], "channel_mix": [], "budget_allocation": [], "timeline_weeks": 0, "requires_legal_review": false, "brief_source": "", "product_or_topic": "", "target_market": "", "objectives": [], "budget_cents": 0, "received_at_utc": "", "needs_market_intelligence": false, "requires_cmo_escalation": false}
    enforce_yields: true
    enforce_yields_retry: 2
    knowledge:
      serviceName: "mongo_main"
      enabled: true
      groupName: "campaign_playbooks"
    # Playbook — the CRAFT, fetched on demand. Only `description` rides in the
    # prompt; `responsibility` is loaded when the model recognises the intent.
    playbook:
      - intent: normalise_brief
        description: "How to turn a raw brief from any channel into the canonical CampaignBrief."
        responsibility: |
          1. Read the payload FIRST — form fields, email body, launch metadata,
             or Asana task. Map each source field to a CampaignBrief field.
          2. Never invent a budget, market, or objective the brief does not
             state — leave it at its type default and let the flow ask.
          3. Mint a campaign_id only when none exists upstream, so a re-entry or
             a HITL resume keeps the SAME id.
        variables: [campaign_id]
      - intent: build_strategy
        description: "How to build a defensible strategy, KPI set, channel mix, and budget."
        responsibility: |
          1. Anchor on the primary segment (highest fit) and the top objective.
          2. Pick a channel mix from the segment's channel history — weight
             toward the best historical ROAS; state a rationale per channel.
          3. Allocate budget across the mix so the allocation SUMS to the brief
             budget; set one measurable KPI per objective with a window.
          4. Flag requires_legal_review on any regulated-industry or comparative/
             superiority claim — do NOT waive it; the compliance gate will catch
             what you miss, but flag what you can.
        variables: [campaign_id, target_market]
    yields:
      campaign_id: "string"
      strategy_summary: "string"
      kpis: "list"
      channel_mix: "list"
      budget_allocation: "list"
      timeline_weeks: "number"
      requires_legal_review: "boolean"
      brief_source: "string"
      product_or_topic: "string"
      target_market: "string"
      objectives: "list"
      budget_cents: "number"
      received_at_utc: "string"
      needs_market_intelligence: "boolean"
      requires_cmo_escalation: "boolean"
    inputs:
      upstream_yields: "object"
      payload: "object"
    can_call:
      # Budget over the brand ceiling → CMO sign-off BEFORE creative spend
      # (deterministic floor; takes precedence over the fan-out below).
      - agent: "cmo_human"
        condition: "calling_agent_response.requires_cmo_escalation == true"
      - agent: "market_intelligence_agent"
        condition: "calling_agent_response.needs_market_intelligence == true and calling_agent_response.requires_cmo_escalation == false"
      - agent: "copywriter_agent"
        condition: "calling_agent_response.needs_market_intelligence == false and calling_agent_response.requires_cmo_escalation == false"
      - agent: "visual_briefer_agent"
        condition: "calling_agent_response.needs_market_intelligence == false and calling_agent_response.requires_cmo_escalation == false"
    auto_store_response: true
    auto_store_yields: true

  # ────────────────────────────────────────────────────────────
  # market_intelligence_agent — ONE analyst role (Rule 2): audience segments/
  # personas + competitor landscape. It PULLS its own data through tools (the
  # model calls them in-turn) so the mcp path is a drop-in: wire the CDP /
  # competitive-intel MCP and the same reads come from the real platform. Its
  # module keeps @chain enforce_threat_floor — any high/critical/severe
  # competitor is force-merged into threat_alerts so the crisis fast-path fires
  # even if the LLM under-reports.
  # ────────────────────────────────────────────────────────────
  market_intelligence_agent:
    name: "market_intelligence_agent"
    agent_type: "llm"
    communication_type: "chain"
    model: "gpt-4o-mini"
    temperature: 0.3
    max_tokens: 1800
    max_tool_calls_per_message: 15   # pulls segments + competitors + performance; default 5 truncates silently
    description: "Market Intelligence Analyst — audience segments + persona scores AND the competitor landscape for the brief"
    prompt: |
      You are the Market Intelligence Analyst. For every request, do BOTH
      responsibilities and return ONE JSON object with ALL keys below. PULL the
      data FIRST with your tools — read_audience_segments, read_competitor_signals,
      and read_past_performance for the target market — before you score
      anything; you cannot segment a market you have not read.

      1. Audience intelligence — segment the market for this brief:
         primary_segments (ranked by fit), persona_scores ({persona, fit_score,
         why}), estimated_reach (a number; 0 when unknown, never prose),
         exclusion_signals (audience traits to EXCLUDE for safety),
         frequency_cap_recommendation (impressions/user/week; use 3 when unsure).

      2. Competitor landscape: competitor_summary ({name, recent_move,
         threat_level}), market_share_signals (short text), whitespace_opportunities
         (unaddressed positions), threat_alerts (ONLY imminent threats warranting
         CMO awareness — empty is normal), intel_briefing (3-4 sentences for the
         manager; lead with the top threat OR opportunity; recommend a defensive
         posture when threat_alerts is non-empty, offensive otherwise; never empty).
      Load the `segmentation` playbook for how to score segments and the
      `competitor_scan` playbook for how to read the landscape.

      OUTPUT CONTRACT — respond with ONLY valid JSON containing exactly these keys:
      {"primary_segments": [], "persona_scores": [], "estimated_reach": 0, "exclusion_signals": [], "frequency_cap_recommendation": 0, "competitor_summary": [], "market_share_signals": "", "whitespace_opportunities": [], "threat_alerts": [], "intel_briefing": ""}
    enforce_yields: true
    enforce_yields_retry: 2
    knowledge:
      serviceName: "mongo_main"
      enabled: true
      groupName: "competitor_intel"
    playbook:
      - intent: segmentation
        description: "How to score audience segments and personas for a brief."
        responsibility: |
          1. Read the segment fixture for the target market; rank segments by
             fit_score, keeping the size + a one-line why for each.
          2. Derive exclusion_signals from the segment's exclusions (never target
             a protected or unsafe trait).
          3. estimated_reach is the sum of addressable segment sizes; use the
             segment's frequency_cap when present, else 3.
        variables: [target_market]
      - intent: competitor_scan
        description: "How to read the competitor landscape and flag imminent threats."
        responsibility: |
          1. Read competitor signals for the market; summarise each
             {name, recent_move, threat_level}.
          2. threat_alerts is ONLY the high/critical/severe movers — a price cut,
             a launch, a campaign that needs a defensive response now.
          3. whitespace_opportunities are positions no tracked competitor holds.
        variables: [target_market]
    tools: [read_audience_segments, read_competitor_signals, read_past_performance]
    tool_categories: [intel]
    # ── To wire a real CDP / competitive-intel platform, set the URL and
    #    uncomment. Each named action under `use:` becomes its own tool
    #    (e.g. cdp_read_segments). NOTE: the SDK rejects an http mcp block with
    #    an EMPTY url at load, so this ships COMMENTED — fill the URL, then
    #    uncomment. The dev-store tools above are the day-0 fallback contract. ──
    # mcp:
    #   - transport: http
    #     url: "${CDP_MCP_URL}"
    #     token: "${CDP_MCP_TOKEN:}"
    #     use: [read_segments, read_personas]
    #     name: cdp
    #     timeout: 30
    #   - transport: http
    #     url: "${COMPETITIVE_INTEL_MCP_URL}"
    #     token: "${COMPETITIVE_INTEL_MCP_TOKEN:}"
    #     use: [read_signals, read_share]
    #     name: intel
    #     timeout: 30
    yields:
      primary_segments: "list"
      persona_scores: "list"
      estimated_reach: "number"
      exclusion_signals: "list"
      frequency_cap_recommendation: "number"
      competitor_summary: "list"
      market_share_signals: "string"
      whitespace_opportunities: "list"
      threat_alerts: "list"
      intel_briefing: "string"
    inputs:
      upstream_yields: "object"
      target_market: "string"
    can_call:
      - agent: "campaign_strategist_agent"
      - agent: "brand_guardian_agent"
        condition: "calling_agent_response.threat_alerts != []"
    auto_store_response: true
    auto_store_yields: true

  # ────────────────────────────────────────────────────────────
  # copywriter_agent — self-reliant copywriter. agency/copywriter_agent.py:
  #   @pre_compose load_brand_voice pulls the brand voice + tone rules +
  #     banned-claim lexicon so it drafts in-voice;
  #   @chain flag_banned_in_copy forces has_protected_claims=true on any
  #     banned-term slip so it never hands the compliance gate copy that
  #     silently claims it is clean.
  # ────────────────────────────────────────────────────────────
  copywriter_agent:
    name: "copywriter_agent"
    agent_type: "llm"
    communication_type: "chain"
    model: "gpt-4o-mini"
    temperature: 0.7
    max_tokens: 2000
    description: "Copywriter — drafts 3 copy variants per channel (A/B/C for test-and-learn)"
    prompt: |
      Draft copy variants for each channel in the campaign mix. Return JSON with
      these keys (all required):
        - variants_by_channel: list of {channel, variants list}
        - tone_used: string — chosen tone descriptor (default "professional")
        - reading_grade: number — Flesch-Kincaid estimate (~8 for broad reach;
          always a number, never prose)
        - has_protected_claims: boolean — true when ANY variant makes a
          regulated (finance/health), comparative, or superiority claim
        - copy_briefing: 2 sentences for the manager — variant count, channel
          count, tone, reading grade, whether claims were flagged; never empty

      When invoked after a human "revise" decision, treat human_message as the
      revision instruction and redraft — proceed with whatever campaign context
      is available (a draft is internal; fail-soft).

      OUTPUT CONTRACT — respond with ONLY valid JSON containing exactly these keys:
      {"variants_by_channel": [], "tone_used": "", "reading_grade": 0, "has_protected_claims": false, "copy_briefing": ""}
    enforce_yields: true
    enforce_yields_retry: 2
    yields:
      variants_by_channel: "list"
      tone_used: "string"
      reading_grade: "number"
      has_protected_claims: "boolean"
      copy_briefing: "string"
    inputs:
      upstream_yields: "object"
    can_call:
      - agent: "compliance_reviewer_agent"
    auto_store_response: true
    auto_store_yields: true

  # ────────────────────────────────────────────────────────────
  # visual_briefer_agent — Art Director / creative briefer. Pure-YAML LLM: the
  # rules live in the prompt (no deterministic floor needed — a visual brief is
  # internal and reviewed downstream by compliance).
  # ────────────────────────────────────────────────────────────
  visual_briefer_agent:
    name: "visual_briefer_agent"
    agent_type: "llm"
    communication_type: "chain"
    model: "gpt-4o-mini"
    temperature: 0.6
    max_tokens: 1500
    description: "Art Director — builds the visual creative brief; handoff to image generation or a designer"
    prompt: |
      Build the visual creative brief for each channel that requires imagery.
      Return JSON with these keys (all required):
        - visual_briefs: list of {channel, format, aspect_ratio, mood,
          dominant_colors, must_show, must_avoid}
        - has_people: boolean — does any brief include people imagery
        - representation_check: list of audience-representation notes (never
          empty when has_people is true)
        - generation_prompts: list of {channel, prompt_for_dalle3}
        - visual_briefing: 2 sentences for the manager — brief count, prompt
          count, whether people imagery is included; never empty

      OUTPUT CONTRACT — respond with ONLY valid JSON containing exactly these keys:
      {"visual_briefs": [], "has_people": false, "representation_check": [], "generation_prompts": [], "visual_briefing": ""}
    enforce_yields: true
    enforce_yields_retry: 2
    yields:
      visual_briefs: "list"
      has_people: "boolean"
      representation_check: "list"
      generation_prompts: "list"
      visual_briefing: "string"
    inputs:
      upstream_yields: "object"
    can_call:
      - agent: "compliance_reviewer_agent"
    auto_store_response: true
    auto_store_yields: true

  # ────────────────────────────────────────────────────────────
  # compliance_reviewer_agent — LLM verdict + a DETERMINISTIC floor + the HITL
  # bridge. agency/compliance_reviewer_agent.py:
  #   @pre_compose load_brand_rules pulls the banned-claim / legal-trigger
  #     lexicon (dev store day-0; brand wiki in prod);
  #   @chain enforce_compliance_floor scans the ACTUAL copy variants — a
  #     banned-claim hit forces approved_for_publish=false; a legal-trigger /
  #     regulated-industry hit forces requires_legal_review=true (the LLM can
  #     never lower either) — THEN stashes the reviewed campaign payload keyed
  #     by session BEFORE the human gate so the fail-closed publisher recovers
  #     exactly what was approved.
  # ────────────────────────────────────────────────────────────
  compliance_reviewer_agent:
    name: "compliance_reviewer_agent"
    agent_type: "llm"
    communication_type: "chain"
    model: "gpt-4o-mini"
    temperature: 0.0
    max_tokens: 1500
    wait_for: "copywriter_agent AND visual_briefer_agent"
    description: "Brand-safety + legal-claim review — gates the campaign before approval routing"
    prompt: |
      Review the campaign for brand safety + legal compliance. Return JSON with
      these keys (all required):
        - brand_safety_score: 0..1 — confidence the creative is on-brand
        - flagged_claims: list of {claim, channel, risk_level}
        - required_disclaimers: list of {disclaimer_text, channel}
        - protected_attribute_risk: boolean — any audience targeting edges into
          protected attributes
        - requires_legal_review: boolean — true on any high/critical/severe
          flagged claim OR a regulated industry
        - approved_for_publish: boolean — DEFAULT-DENY: true ONLY when
          flagged_claims is empty AND protected_attribute_risk is false AND
          brand_safety_score >= 0.6
        - reviewer_briefing: 3 sentences for the manager — lead with
          approved-or-not, name the strongest concern, recommend the next step;
          never empty
        - campaign_id, strategy_summary: echo verbatim from the campaign context
          so the manager/legal inbox sees WHICH campaign is on review

      OUTPUT CONTRACT — respond with ONLY valid JSON containing exactly these keys:
      {"brand_safety_score": 0, "flagged_claims": [], "required_disclaimers": [], "protected_attribute_risk": false, "requires_legal_review": false, "approved_for_publish": false, "reviewer_briefing": "", "campaign_id": "", "strategy_summary": ""}
    enforce_yields: true
    enforce_yields_retry: 2
    knowledge:
      serviceName: "mongo_main"
      enabled: true
      groupName: "brand_safety_rules"
    yields:
      brand_safety_score: "number"
      flagged_claims: "list"
      required_disclaimers: "list"
      protected_attribute_risk: "boolean"
      requires_legal_review: "boolean"
      approved_for_publish: "boolean"
      reviewer_briefing: "string"
      campaign_id: "string"
      strategy_summary: "string"
    inputs:
      upstream_yields: "object"
    can_call:
      - agent: "marketing_manager_human"
        condition: "calling_agent_response.requires_legal_review == false"
      - agent: "legal_reviewer_human"
        condition: "calling_agent_response.requires_legal_review == true"
    auto_store_response: true
    auto_store_yields: true

  # ────────────────────────────────────────────────────────────
  # brand_guardian_agent — ONE guardian role (Rule 2): crisis response drafting
  # + brand-sentiment spike judgment. Sentiment history lives in YOUR
  # social-listening platform; rollups arrive via the ingest/sweep entries.
  # agency/brand_guardian_agent.py @chain enforce_crisis_floor: crisis mode
  # forces requires_cmo_action=true (a crisis ALWAYS reaches the CMO); the
  # severe-negative-spike rule (volume>0.5 AND sentiment<-0.3) is recomputed
  # from the rollups, not trusted to the LLM; regulatory/data-breach forces
  # "legal" into escalate_to.
  # ────────────────────────────────────────────────────────────
  brand_guardian_agent:
    name: "brand_guardian_agent"
    agent_type: "llm"
    communication_type: "chain"
    model: "gpt-4o-mini"
    temperature: 0.1
    max_tokens: 1500
    description: "Brand Guardian — tracks brand sentiment + detects spikes; drafts the fast-path crisis response when a signal lands"
    prompt: |
      You are the Brand Guardian. Two responsibilities:

      1. Crisis response (mode empty or "crisis") — coordinate the response to a
         brand / PR crisis signal:
        - severity: 0..1 — when uncertain, err high (0.8)
        - crisis_type: EXACTLY one of brand_safety | regulatory | data_breach |
          competitor_attack | other
        - immediate_action: short directive — never empty; default "Pause active
          campaigns; convene crisis team; draft holding statement."
        - holding_statement_draft: text UNDER 280 characters — never empty
        - escalate_to: list of roles — ALWAYS include "cmo"; ALSO "legal" when
          crisis_type is "regulatory" or "data_breach"
        - cmo_briefing: 3 sentences — severity + type, the immediate action, the
          next 2 hours
        - requires_cmo_action is ALWAYS true in crisis mode (default-deny floor)
        - echo campaign_id + strategy_summary when the crisis is tied to a
          campaign ("" for off-campaign crises); mode: "crisis".

      2. Brand sentiment review (mode "ingest" or "report") — your social-listening
         platform owns the ledger and supplies the rollups in the input
         (mentions_last_7d, mentions_last_30d, avg_sentiment_7d, avg_sentiment_30d,
         volume_change_pct, top_negative_sources). Echo them into the matching
         keys. severe_negative_spike = true ONLY when volume_change_pct > 0.5 AND
         avg_sentiment_7d < -0.3; requires_cmo_action = severe_negative_spike;
         severity 0, crisis_type "other"; sentiment_briefing summarises volume vs
         prior period + 7d/30d sentiment; copy it into cmo_briefing; mode: echo
         the input mode.

      OUTPUT CONTRACT — respond with ONLY valid JSON containing exactly these keys:
      {"severity": 0, "crisis_type": "", "immediate_action": "", "holding_statement_draft": "", "escalate_to": [], "cmo_briefing": "", "campaign_id": "", "strategy_summary": "", "mode": "", "mentions_last_7d": 0, "mentions_last_30d": 0, "avg_sentiment_7d": 0, "avg_sentiment_30d": 0, "volume_change_pct": 0, "top_negative_sources": [], "severe_negative_spike": false, "requires_cmo_action": false, "sentiment_briefing": ""}
    enforce_yields: true
    enforce_yields_retry: 2
    yields:
      severity: "number"
      crisis_type: "string"
      immediate_action: "string"
      holding_statement_draft: "string"
      escalate_to: "list"
      cmo_briefing: "string"
      campaign_id: "string"
      strategy_summary: "string"
      mode: "string"
      mentions_last_7d: "number"
      mentions_last_30d: "number"
      avg_sentiment_7d: "number"
      avg_sentiment_30d: "number"
      volume_change_pct: "number"
      top_negative_sources: "list"
      severe_negative_spike: "boolean"
      requires_cmo_action: "boolean"
      sentiment_briefing: "string"
    inputs:
      upstream_yields: "object"
      mode: "string"
      mentions_last_7d: "number"
      mentions_last_30d: "number"
      avg_sentiment_7d: "number"
      avg_sentiment_30d: "number"
      volume_change_pct: "number"
      top_negative_sources: "list"
    narration: |
      If incoming mentions or replies read angry / hostile toward the brand —
      even when the formal spike rule has not tripped — treat it as an emerging
      crisis and consider routing to cmo_human. If negative sentiment
      concentrates on one live campaign, also consider marketing_manager_human
      so it can be paused.
    can_call:
      # Crisis mode forces requires_cmo_action=true (prompt rule, default-deny
      # floor); sentiment mode sets it only on a severe negative spike.
      - agent: "cmo_human"
        condition: "calling_agent_response.requires_cmo_action == true"
      - agent: "legal_reviewer_human"
        condition: "calling_agent_response.crisis_type == 'regulatory' or calling_agent_response.crisis_type == 'data_breach'"
      # Campaign-tied negative signal below the CMO floor → the marketing
      # manager so the live campaign can be paused (mutually exclusive with the
      # cmo_human edge above).
      - agent: "marketing_manager_human"
        condition: "calling_agent_response.requires_cmo_action == false and calling_agent_response.campaign_id != ''"
    auto_store_response: true
    auto_store_yields: true

  # ────────────────────────────────────────────────────────────
  # publisher_agent — the FINISHER (programmatic actuator behind the human gate).
  # Publishing is outward + PAID, so it FAILS CLOSED. agency/publisher_agent.py:
  #   a) approval RE-CHECK — reaching this agent does not mean approved. An
  #      allow-token allowlist + block-token denylist; an UNKNOWN verdict fails
  #      closed.
  #   b) deterministic invariants a human can't waive — an approved channel mix
  #      recovered from the PRE-GATE stash only (never from LLM context), a real
  #      spend, compliance's approved_for_publish still true.
  #   c) render the real campaign pack to ./out; on a tripped floor DELETE the
  #      partial and record status=blocked with reasons — never a half-published
  #      campaign.
  #   d) dev-store fallback that ANNOUNCES itself (available:false) — no synthetic
  #      "published" ack when there is nothing real to recover.
  # ────────────────────────────────────────────────────────────
  publisher_agent:
    name: "publisher_agent"
    agent_type: "programmatic"
    communication_type: "chain"
    description: "Publishing / Ad-Ops actuator (FINISHER) — multi-channel publish (Meta/IG/LinkedIn/Email); fails closed; tags impressions for attribution"
    yields:
      published_channels: "list"
      total_spend_cents: "number"
      live_variant_ids: "list"
      published_at_utc: "string"
      tracking_pixel_set: "boolean"
      campaign_id: "string"
      status: "string"          # published | blocked
      block_reasons: "array"
      artifact_path: "string"
    inputs:
      upstream_yields: "object"
    can_call:
      - agent: "marketing_analytics_agent"
        condition: "calling_agent_response.status == 'published'"
      - agent: "marketing_audit_logger_agent"
        condition: "always"
    auto_store_response: true
    auto_store_yields: true

  # ────────────────────────────────────────────────────────────
  # marketing_analytics_agent — ONE analytics role (Rule 2): KPI status +
  # multi-touch attribution + email-engagement benchmarks. Metrics live in YOUR
  # analytics platform (GA4 / Amplitude / Looker), not template SQLite. Pure
  # connector-YAML: the n8n workflow queries your platform and returns the
  # declared yields shape (lenient enforcement fills any missing key).
  # ────────────────────────────────────────────────────────────
  marketing_analytics_agent:
    name: "marketing_analytics_agent"
    agent_type: "programmatic"
    communication_type: "chain"
    description: "Marketing Analytics — KPI status, multi-touch attribution, email-engagement benchmarks read from your analytics platform (GA4/Amplitude/Looker)"
    integration: "n8n"
    connector_config:
      webhook_url: "${N8N_MARKETING_ANALYTICS_WEBHOOK_URL:}"
    enforce_yields: true
    enforce_yields_retry: 2
    yields:
      kpi_status: "list"
      top_performers: "list"
      underperformers: "list"
      statistical_significance: "boolean"
      recommended_actions: "list"
      analyst_briefing: "string"
      attribution_model: "string"
      revenue_attributed_cents: "number"
      channel_credits: "list"
      roas_by_channel: "list"
      attribution_confidence: "number"
      mode: "string"
      segment: "string"
      baseline_campaigns_count: "number"
      baseline_open_rate: "number"
      baseline_click_rate: "number"
      baseline_unsubscribe_rate: "number"
      target: "object"
      requires_manager_review: "boolean"
      spike_for_learning: "boolean"
      engagement_briefing: "string"
    inputs:
      upstream_yields: "object"
      mode: "string"
      campaign_id: "string"
      segment: "string"
      sent_at_utc: "string"
      sends: "number"
      opens: "number"
      clicks: "number"
      replies: "number"
      unsubscribes: "number"
    can_call:
      - agent: "marketing_manager_human"
        condition: "calling_agent_response.requires_manager_review == true"
      - agent: "marketing_audit_logger_agent"
        condition: "always"
    auto_store_response: true
    auto_store_yields: true

  # ────────────────────────────────────────────────────────────
  # campaign_orchestrator_agent — weekly sweep across live campaigns. Campaign
  # state (what is live, spend pacing) lives in YOUR MAP (Marketo / HubSpot).
  # Pure connector-YAML. The wake_up stays COMMENTED until the MAP connector is
  # wired — a cron firing into an empty webhook just errors; when you wire it,
  # uncomment BOTH the cron AND the timezone (crons run in UTC otherwise).
  # ────────────────────────────────────────────────────────────
  campaign_orchestrator_agent:
    name: "campaign_orchestrator_agent"
    agent_type: "programmatic"
    communication_type: "chain"
    description: "Campaign Ops Coordinator — weekly sweep of live campaigns (state read from your MAP: Marketo/HubSpot); triggers performance analysis"
    integration: "n8n"
    # wake_up: "0 9 * * 1"        # Monday 09:00 — enable after wiring your MAP connector
    # timezone: "America/New_York"  # crons run in UTC without this (2.4.124+)
    connector_config:
      webhook_url: "${N8N_CAMPAIGN_ORCHESTRATOR_WEBHOOK_URL:}"
    yields:
      week_id: "string"
      campaigns_swept: "number"
      flagged_for_review: "list"
      sweep_completed_at_utc: "string"
    inputs:
      payload: "object"
    can_call:
      - agent: "marketing_analytics_agent"
    auto_store_response: true
    auto_store_yields: true

  # ────────────────────────────────────────────────────────────
  # social_media_agent — multi-platform variant generation + posting-plan
  # proposal + engagement triage. Pure-YAML LLM: the posting calendar lives in
  # YOUR social scheduler (Hootsuite / Buffer / Sprout Social); this agent drafts
  # variants + proposes slots.
  # ────────────────────────────────────────────────────────────
  social_media_agent:
    name: "social_media_agent"
    agent_type: "llm"
    communication_type: "chain"
    model: "claude-sonnet-4-6"
    temperature: 0.5
    max_completion_tokens: 2000
    description: "Social Media Manager — per-platform variants + a posting plan (schedule mode); reply triage (triage mode)"
    prompt: |
      You are the Social Media Manager. Two modes (see input mode):

      MODE "schedule" — given the campaign brief + creative, draft ONE native
      variant per target platform and propose its posting slot. Rules:
      1. Hard character limits (count characters): linkedin 3000 (long-form),
         twitter 280 (hook + 1-2 sentences, ≤2 hashtags), instagram 2200
         (visual-first, 5-10 hashtags), tiktok 2200 (hook in first 7 words,
         3-5 hashtags), youtube 5000. ONLY these five are schedulable.
      2. Next best posting hour (UTC, on the hour): linkedin 08/12/17, twitter
         09/13/18/21, instagram 11/14/19, tiktok 16/20/22, youtube 10/15/19.
      3. scheduled: one object per post — {post_id:
         "post-<campaign_id>-<platform>", platform, variant_text,
         scheduled_for_utc, char_count, char_limit}; scheduled_count = its length.
      4. A variant you cannot fit → put the platform in rejected_for_length;
         requires_copy_rewrite = true when it is non-empty.
      5. action = "schedule"; when campaign_id or the platforms are missing,
         action = "skipped" and every list stays empty.
      6. Triage keys stay empty/zero/false in this mode.

      MODE "triage" — given replies ({reply_id, post_id, text}), classify each:
      1. category positive|neutral|question|angry|spam; urgency 0..1.
      2. Action: positive→"amplify", neutral→"acknowledge", question→"respond",
         angry→"escalate", spam→"ignore".
      3. triaged: {reply_id, post_id, category, urgency, action};
         triaged_count = its length.
      4. escalations: every triaged entry angry OR urgency >= 0.8;
         escalations_count = its length.
      5. needs_crisis_responder = true ONLY when an escalation has urgency >= 0.9.
      6. action = "triage"; schedule keys stay empty/zero/false in this mode.

      OUTPUT CONTRACT — respond with ONLY valid JSON containing exactly these keys:
      {"action": "", "campaign_id": "", "scheduled": [], "scheduled_count": 0, "rejected_for_length": [], "requires_copy_rewrite": false, "triaged_count": 0, "triaged": [], "escalations": [], "escalations_count": 0, "needs_crisis_responder": false}
    enforce_yields: true
    knowledge:
      serviceName: "mongo_main"
      enabled: true
      groupName: "brand_voice"
    yields:
      action: "string"
      campaign_id: "string"
      scheduled: "list"
      scheduled_count: "number"
      rejected_for_length: "list"
      requires_copy_rewrite: "boolean"
      triaged_count: "number"
      triaged: "list"
      escalations: "list"
      escalations_count: "number"
      needs_crisis_responder: "boolean"
    inputs:
      mode: "string"
      upstream_yields: "object"
      campaign_id: "string"
      target_platforms: "list"
      replies: "list"
    can_call:
      # A variant that does not fit a platform limit → back to the copywriter.
      - agent: "copywriter_agent"
        condition: "calling_agent_response.action == 'schedule' and calling_agent_response.requires_copy_rewrite == true"
      # Triage surfaced a crisis-grade reply → the brand guardian fast-path.
      - agent: "brand_guardian_agent"
        condition: "calling_agent_response.action == 'triage' and calling_agent_response.needs_crisis_responder == true"
      # Proposals go to YOUR social scheduler (it owns the calendar) and a clean
      # triage is done — record the terminus. Social scheduling NEVER bypasses
      # the human approval gate into the paid publisher; only an approved
      # campaign reaches the finisher.
      - agent: "marketing_audit_logger_agent"
        condition: "(calling_agent_response.action == 'schedule' and calling_agent_response.requires_copy_rewrite == false) or (calling_agent_response.action == 'triage' and calling_agent_response.needs_crisis_responder == false)"
    auto_store_response: true
    auto_store_yields: true

  # ────────────────────────────────────────────────────────────
  # aeo_geo_optimiser_agent — content audit for AI answer engines (ChatGPT /
  # Perplexity / Gemini / Claude / Copilot pickup). Runs as PARALLEL INSTANCES:
  # one activation fans into N copies that each claim a DISJOINT batch of pages
  # via the atomic claim tool (claim_audit_batch), so a large backlog is split,
  # not duplicated. A LIVE weekly wake_up runs the sweep — with a timezone, so
  # it fires at 03:00 local, not 03:00 UTC. agency/aeo_geo_optimiser_agent.py
  # @chain reshape_combined recomputes average_score + re-trims
  # high_priority_rewrites after the instance results are combined (a summed
  # average would be wrong).
  # ────────────────────────────────────────────────────────────
  aeo_geo_optimiser_agent:
    name: "aeo_geo_optimiser_agent"
    agent_type: "llm"
    communication_type: "chain"
    model: "gpt-4o-mini"
    temperature: 0.1
    max_tokens: 2000
    max_tool_calls_per_message: 10   # claims a batch then scores each page
    description: "AEO/GEO Content Optimiser — scores pages for AI-answer-engine pickup; recommends issue-specific rewrites"
    instances: 3                     # 3 parallel copies per activation (2.4.118+)
    instances_handoff: last          # combine deterministically, route once
    wake_up: "0 3 * * 0"             # Sunday 03:00 weekly content sweep (LIVE)
    timezone: "America/New_York"     # crons run in UTC without this (2.4.124+)
    wake_up_input:
      mode: sweep
    prompt: |
      You are the AEO/GEO Content Auditor. Classic SEO targets Google results;
      you target the AI answer engines that increasingly intermediate the user's
      question. FIRST call claim_audit_batch to pull YOUR disjoint batch of pages
      (other parallel copies claim the rest); score each page you claimed.

      Scoring rubric (start each page at 0, then clamp 0..1):
        +0.15 H2/H3 subheadings present
        +0.20 three or more question-shaped passages ("what/how/why/when/where/
              which …?"); +0.10 for one or two
        +0.10 definition pattern ("X is defined as", "means", "refers to")
        +0.15 three or more citation markers (according to / source: / [1] /
              <cite / schema.org/citation); +0.08 for one or two
        +0.10 JSON-LD / schema.org markup present
        +0.10 author byline or publication-date metadata present
        +0.10 content length 600-2500 words
        -0.10 keyword stuffing (same word 5+ times in close succession)
        -0.05 thin intro (opening section under ~200 characters)

      Issue labels: no_subheadings, no_questions, no_definition, low_citations,
      no_schema_markup, no_author_or_date, keyword_stuffing, thin_intro,
      under_length (< 300 words), over_length (> 4000 words). Recommend a
      specific rewrite per issue.

      Output rules:
      1. scored_pages: {url, aeo_score (2 dp), issues, recommendations}.
      2. total_pages = pages scored; average_score = mean aeo_score (2 dp).
      3. A page needs a rewrite when aeo_score < 0.5; needs_rewrite_count = how many.
      4. high_priority_rewrites: the 10 LOWEST-scoring pages needing a rewrite,
         worst first.
      5. requires_content_team_review = true when needs_rewrite_count > 0.
      6. Empty / no pages claimed: every list empty, every number 0,
         requires_content_team_review false.

      OUTPUT CONTRACT — respond with ONLY valid JSON containing exactly these keys:
      {"scored_pages": [], "total_pages": 0, "average_score": 0, "needs_rewrite_count": 0, "high_priority_rewrites": [], "requires_content_team_review": false}
    tools: [claim_audit_batch]
    tool_categories: [audit]
    yields:
      scored_pages: "list"
      total_pages: "number"
      average_score: "number"
      needs_rewrite_count: "number"
      high_priority_rewrites: "list"
      requires_content_team_review: "boolean"
    inputs:
      mode: "string"
      pages: "list"
    can_call:
      - agent: "copywriter_agent"
        condition: "calling_agent_response.requires_content_team_review == true"
      - agent: "marketing_audit_logger_agent"
        condition: "calling_agent_response.requires_content_team_review == false"
    auto_store_response: true
    auto_store_yields: true

  # ════════════════════════════════════════════════════════════
  # HUMAN ROSTER — first-class members, reached in their own channel via the
  # webhook boundary. Every gate DEFAULT-DENIES on timeout (fallback ->
  # held_for_review -> audit). `dual` belongs ONLY on these human/boundary
  # agents; every AI specialist above is `chain` (dual↔dual auto-bounces —
  # gotcha #17). No human is wired directly to another human — the coordinator
  # or the Manager supervisor bridges them.
  # ════════════════════════════════════════════════════════════

  marketing_manager_human:
    name: "marketing_manager_human"
    agent_type: "human"
    human_interface: "webhook"
    communication_type: "dual"
    human_timeout_seconds: 3600
    description: "Marketing Manager — campaign approval, scale/pause decisions, calendar owner"
    fallback_on_timeout: true
    fallback_response:
      human_decision: held
      human_message: held_for_review
    webhook_config:
      outbound_url: "${HITL_OUTBOUND_URL:http://127.0.0.1:9999/human-notify}"
      outbound_headers: {Content-Type: "application/json"}
      outbound_timeout: 30
      max_retries: 1
      retry_delay: 2
    human_prompt_template: |
      Campaign approval — review the strategy, creative variants, and compliance
      summary before approving for publish. Revise on tone / audience / claim
      concerns. Budgets over the brand ceiling are escalated to the CMO by the
      supervisor automatically.
    yields:
      human_message: "string"       # approve | revise | held_for_review
    inputs:
      campaign_id: "string"
      strategy_summary: "string"
      reviewer_briefing: "string"
    can_call:
      - agent: "publisher_agent"
        condition: "calling_agent_response.human_message == 'approve'"
      - agent: "copywriter_agent"
        condition: "calling_agent_response.human_message == 'revise'"
      # On silence/hold, record it and let the Manager SUPERVISOR escalate to the
      # CMO (manager.escalation.targets) — no hardcoded human→human wire.
      - agent: "marketing_audit_logger_agent"
        condition: "calling_agent_response.human_message == 'held_for_review' or calling_agent_response.human_message == 'hold'"

  legal_reviewer_human:
    name: "legal_reviewer_human"
    agent_type: "human"
    human_interface: "webhook"
    communication_type: "dual"
    human_timeout_seconds: 14400   # 4h; reminders as the supervisor sees fit
    description: "Legal Counsel — reviews regulated claims, comparative copy, disclaimers"
    fallback_on_timeout: true
    fallback_response:
      human_decision: held
      human_message: held_for_review
    webhook_config:
      outbound_url: "${HITL_OUTBOUND_URL:http://127.0.0.1:9999/human-notify}"
      outbound_headers: {Content-Type: "application/json"}
      outbound_timeout: 30
    human_prompt_template: |
      Legal review — confirm the claims are defensible, disclaimers are adequate,
      and comparative copy is fair. Default-deny on ambiguity.
    yields:
      human_message: "string"       # approve | revise | held_for_review
    inputs:
      campaign_id: "string"
      flagged_claims: "list"
      required_disclaimers: "list"
    can_call:
      # Legal cleared the claims → the coordinator advances to the marketing
      # manager for final sign-off (an AI bridge — never human→human).
      - agent: "campaign_coordinator_agent"
        condition: "calling_agent_response.human_message == 'approve'"
      - agent: "copywriter_agent"
        condition: "calling_agent_response.human_message == 'revise'"
      - agent: "marketing_audit_logger_agent"
        condition: "calling_agent_response.human_message == 'held_for_review' or calling_agent_response.human_message == 'hold'"

  cmo_human:
    name: "cmo_human"
    agent_type: "human"
    human_interface: "webhook"
    communication_type: "dual"
    human_timeout_seconds: 28800   # 8h
    description: "Chief Marketing Officer — high-stakes campaigns, brand crises, budget escalations"
    fallback_on_timeout: true
    fallback_response:
      human_decision: held
      human_message: held_for_review
    webhook_config:
      outbound_url: "${HITL_OUTBOUND_URL:http://127.0.0.1:9999/human-notify}"
      outbound_headers: {Content-Type: "application/json"}
      outbound_timeout: 30
    human_prompt_template: |
      CMO call — high-stakes campaign, budget escalation, or brand crisis.
      Approve only when budget, brand-fit, and timing are sound.
    yields:
      human_message: "string"       # approve | revise | held_for_review
    inputs:
      campaign_id: "string"
      strategy_summary: "string"
      cmo_briefing: "string"
    can_call:
      # Budget signed off (approve) OR sent back (revise) → the strategist
      # proceeds / re-plans. A crisis or a hold is recorded to the WORM sink.
      - agent: "campaign_strategist_agent"
        condition: "calling_agent_response.human_message == 'approve' or calling_agent_response.human_message == 'revise'"
      - agent: "marketing_audit_logger_agent"
        condition: "calling_agent_response.human_message == 'held_for_review' or calling_agent_response.human_message == 'hold' or calling_agent_response.human_message == 'crisis_active'"

  # ────────────────────────────────────────────────────────────
  # marketing_audit_logger_agent — hash-chained WORM audit sink, the terminus of
  # every path. agent_type: external + framework: custom — SDK 2.4+ executes it
  # through an intelligence function registered in main.py
  # (audit_logger.register(mesh, "marketing_audit_logger_agent")), after
  # from_yaml and before start. Each entry embeds the SHA-256 of the prior
  # entry's body, so any insertion/deletion is detectable post-hoc.
  # ────────────────────────────────────────────────────────────
  marketing_audit_logger_agent:
    name: "marketing_audit_logger_agent"
    agent_type: "external"
    framework: "custom"
    communication_type: "execute"
    description: "WORM audit — hash-chains every campaign decision, publish, approval, and held gate. Terminus."
    connector_config:
      sink_type: local_file
      local_file_path: "./logs/marketing_audit.jsonl"
    can_call: []
